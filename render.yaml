services:
  - type: web
    name: emora-backend
    runtime: python
    plan: free
    rootDir: backend/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STORAGE_BACKEND
        value: sqlite
